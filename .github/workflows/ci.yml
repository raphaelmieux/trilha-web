name: CI

on:
  # `'**'` and not `'*'`: a single star stops at a slash, so it would have
  # matched `main` and nothing else that runs here — every working branch in
  # this repo is named like `claude/online-project-management-yf3sg0`. It would
  # have looked like the fix while changing nothing.
  #
  # Until now a push to a branch with no pull request open ran no checks at all:
  # lint, typecheck, the tests and the build only met the code once a PR existed
  # — or once it was already on `main`, which is where it deploys from.
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Deliberately no VITE_SUPABASE_* here. A fresh clone has no .env, and CI is
    # the only place that would notice if importing the Supabase client started
    # throwing again at module load. Setting placeholders would hide exactly the
    # failure this job should catch. See src/lib/supabase.ts.
    steps:
      - uses: actions/checkout@v4

      # `.gitignore` only ever applies to files git is not already tracking.
      # Once `.env` is committed the ignore rule stops protecting it: it is a
      # tracked file like any other, and every later push carries it along
      # without a word. That is how it got in — uploading through the GitHub web
      # interface does not consult .gitignore at all.
      #
      # The two values it held are publishable and already ship inside the
      # browser bundle, so nothing had to be rotated. This guard is about the
      # next one: a .env in a public repository is an invitation to put a real
      # secret there, and the check that catches it has to be cheaper than the
      # habit of remembering.
      - name: No .env in the repository
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it with 'git rm --cached .env' and commit — the .gitignore entry cannot help while the file is tracked. Configuration for CI belongs in repository secrets; see .env.example and the README."
            exit 1
          fi
          echo "No .env tracked."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
